<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Колесо фортуны — Да / Нет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(ellipse at center, #1e1a2b 0%, #0e0b16 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', 'Segoe UI', serif;
            padding: 16px;
            margin: 0;
        }
        .app-container {
            width: 100%;
            max-width: 820px;
            background: rgba(30, 26, 43, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 30px 24px 36px;
            border: 1px solid rgba(255, 215, 150, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #f0e6d3;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.3);
            margin-bottom: 4px;
        }
        .subtitle {
            color: #b8a9c9;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 18px;
            border-bottom: 1px dashed rgba(255, 215, 150, 0.15);
            padding-bottom: 12px;
        }
        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #wheel-container {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 0 6px rgba(255, 215, 150, 0.15), 0 0 40px rgba(0, 0, 0, 0.6);
            touch-action: manipulation;
            background: #2a1f33;
        }
        #wheel-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: auto;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 40px solid #ffd966;
            filter: drop-shadow(0 0 12px rgba(255, 200, 100, 0.6));
            z-index: 20;
            pointer-events: none;
        }
        .result-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            font-size: 2.4rem;
            font-weight: 700;
            color: #f0e6d3;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 200, 100, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            font-family: 'Cinzel', serif;
            z-index: 15;
            background: rgba(0, 0, 0, 0.55);
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 150, 0.25);
            backdrop-filter: blur(4px);
            text-align: center;
            max-width: 80%;
            line-height: 1.3;
            will-change: opacity;
        }
        .result-overlay.show {
            opacity: 1;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 8px 0 4px;
            width: 100%;
            max-width: 500px;
        }
        .controls input,
        .controls button {
            font-family: 'Cinzel', 'Segoe UI', serif;
        }
        .controls input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 150, 0.2);
            border-radius: 40px;
            padding: 8px 16px;
            color: #f0e6d3;
            font-size: 0.85rem;
            min-width: 100px;
            flex: 1;
            outline: none;
            transition: border-color 0.2s;
        }
        .controls input:focus {
            border-color: #ffd966;
        }
        .controls input::placeholder {
            color: #7a6a8a;
        }
        .btn {
            background: linear-gradient(145deg, #3d2e4a, #261e30);
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f0e6d3;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b0812, 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.08s linear;
            border: 1px solid rgba(255, 215, 150, 0.15);
            touch-action: manipulation;
            white-space: nowrap;
            will-change: transform;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0b0812, 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 215, 150, 0.3);
        }
        .btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0b0812, 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0b0812;
            cursor: not-allowed;
        }
        .btn-primary {
            background: linear-gradient(145deg, #5a3f6a, #3d2a4a);
            border-color: rgba(255, 215, 150, 0.25);
            padding: 10px 28px;
        }
        .btn-spin {
            background: linear-gradient(145deg, #6a4f3a, #4a3525);
            border-color: rgba(255, 180, 80, 0.3);
            padding: 12px 36px;
            font-size: 1rem;
        }
        .sector-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 10px;
            margin: 10px 0 6px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 150, 0.06);
            min-height: 44px;
            max-width: 500px;
            width: 100%;
        }
        .sector-tag {
            background: rgba(255, 215, 150, 0.1);
            border: 1px solid rgba(255, 215, 150, 0.15);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.8rem;
            color: #d4c8d9;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .sector-tag .remove {
            cursor: pointer;
            color: #7a6a8a;
            font-weight: 700;
            margin-left: 2px;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.2s;
            user-select: none;
        }
        .sector-tag .remove:hover {
            color: #ff6b6b;
        }
        .history-section {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 215, 150, 0.08);
            width: 100%;
            max-width: 500px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-header span {
            color: #b8a9c9;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .clear-history {
            background: none;
            border: none;
            color: #7a6a8a;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline dotted;
            padding: 4px 10px;
            border-radius: 20px;
            transition: color 0.2s, background 0.2s;
            font-family: inherit;
        }
        .clear-history:hover {
            color: #f0e6d3;
            background: rgba(255, 215, 150, 0.06);
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 30px;
        }
        .history-item {
            background: rgba(255, 215, 150, 0.06);
            border: 1px solid rgba(255, 215, 150, 0.08);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
            color: #c4b8c9;
            animation: fade-in 0.2s ease;
        }
        .history-item.highlight {
            background: rgba(255, 215, 150, 0.15);
            border-color: #ffd966;
            color: #ffd966;
        }
        .empty-history {
            color: #5a4a6a;
            font-size: 0.85rem;
            font-style: italic;
        }
        @keyframes fade-in {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @media (max-width: 480px) {
            .app-container {
                padding: 20px 14px 24px;
                border-radius: 32px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .result-overlay {
                font-size: 1.6rem;
                padding: 0.2rem 1rem;
            }
            .controls input {
                min-width: 70px;
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .btn {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .btn-spin {
                font-size: 0.85rem;
                padding: 10px 24px;
            }
            .sector-tag {
                font-size: 0.7rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>КОЛЕСО</h1>
        

        <div class="wheel-wrapper">
            <div id="wheel-container">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <div class="pointer"></div>
                <div class="result-overlay" id="resultOverlay">✦</div>
            </div>

            <div class="controls">
                <input type="text" id="sectorInput" placeholder="Название сектора" maxlength="30" />
                <button class="btn btn-primary" id="addSectorBtn">➕ Добавить</button>
                <button class="btn btn-spin" id="spinBtn">🎲 Крутить!</button>
            </div>

            <div class="sector-list" id="sectorList"></div>

            <div class="history-section">
                <div class="history-header">
                    <span>📜 История</span>
                    <button class="clear-history" id="clearHistoryBtn">Очистить</button>
                </div>
                <div class="history-list" id="historyList">
                    <span class="empty-history">— ещё не крутили —</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── ЭЛЕМЕНТЫ ──
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('wheel-container');
            const resultOverlay = document.getElementById('resultOverlay');
            const sectorInput = document.getElementById('sectorInput');
            const addBtn = document.getElementById('addSectorBtn');
            const spinBtn = document.getElementById('spinBtn');
            const sectorList = document.getElementById('sectorList');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            // ── СОСТОЯНИЕ ──
            let sectors = ['Да', 'Нет'];
            let history = [];
            let isSpinning = false;
            let currentAngle = 0;
            let highlightIndex = -1;
            let animationId = null;
            let resizeTimeout = null;

            // ── ЦВЕТА ──
            const colors = [
                '#6a4a7a', '#4a6a7a', '#7a6a4a', '#6a5a3a', '#5a3a5a',
                '#3a5a5a', '#5a4a3a', '#7a4a5a', '#4a5a3a', '#5a6a4a',
                '#6a3a4a', '#3a6a4a', '#4a4a6a', '#6a4a3a', '#3a5a4a',
                '#5a3a4a', '#4a6a3a', '#3a4a6a', '#6a3a5a', '#5a4a6a'
            ];

            // ── ОТРИСОВКА (ОПТИМИЗИРОВАННАЯ) ──
            function drawWheel(highlight = -1) {
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const radius = Math.min(w, h) / 2 - 8;

                ctx.clearRect(0, 0, w, h);

                const count = sectors.length;
                if (count === 0) {
                    ctx.fillStyle = '#2a1f33';
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#7a6a8a';
                    ctx.font = '20px "Cinzel", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('➕ Добавьте секторы', cx, cy);
                    return;
                }

                const arc = (Math.PI * 2) / count;

                for (let i = 0; i < count; i++) {
                    const start = i * arc + currentAngle;
                    const end = start + arc;

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, start, end);
                    ctx.closePath();

                    const colorIdx = i % colors.length;
                    if (i === highlight) {
                        ctx.fillStyle = '#ffd966';
                        ctx.shadowColor = 'rgba(255, 200, 100, 0.4)';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.fillStyle = colors[colorIdx];
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.strokeStyle = 'rgba(255,215,150,0.12)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // Текст
                    const midAngle = start + arc / 2;
                    const textRadius = radius * 0.62;
                    const tx = cx + Math.cos(midAngle) * textRadius;
                    const ty = cy + Math.sin(midAngle) * textRadius;

                    ctx.save();
                    ctx.translate(tx, ty);
                    const rot = midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0);
                    ctx.rotate(rot);

                    ctx.fillStyle = '#f0e6d3';
                    ctx.font = 'bold 18px "Cinzel", "Segoe UI", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.7)';
                    ctx.shadowBlur = 6;

                    const label = sectors[i] || `#${i+1}`;
                    const displayLabel = label.length > 10 ? label.slice(0, 10) + '…' : label;
                    ctx.fillText(displayLabel, 0, 0);
                    ctx.restore();
                }

                // Центр
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
                grad.addColorStop(0, '#3d2e4a');
                grad.addColorStop(1, '#1a1425');
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,215,150,0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffd966';
                ctx.font = '16px "Cinzel", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(255,200,100,0.3)';
                ctx.shadowBlur = 10;
                ctx.fillText('✦', cx, cy + 1);
                ctx.shadowBlur = 0;
            }

            // ── UI ОБНОВЛЕНИЕ ──
            function updateUI(highlight = -1) {
                highlightIndex = highlight;
                drawWheel(highlight);
                renderSectorTags();
            }

            function renderSectorTags() {
                if (sectors.length === 0) {
                    sectorList.innerHTML =
                    '<span style="color:#5a4a6a;font-size:0.8rem;font-style:italic;">Нет секторов</span>';
                    return;
                }
                let html = '';
                for (let i = 0; i < sectors.length; i++) {
                    html += `<span class="sector-tag">
                                ${sectors[i]}
                                <span class="remove" data-index="${i}">✕</span>
                             </span>`;
                }
                sectorList.innerHTML = html;

                document.querySelectorAll('.sector-tag .remove').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        removeSector(idx);
                    });
                });
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<span class="empty-history">— ещё не крутили —</span>';
                    return;
                }
                let html = '';
                const items = history.slice(-20);
                for (const val of items) {
                    const cls = val.highlight ? 'history-item highlight' : 'history-item';
                    html += `<span class="${cls}">${val.label}</span>`;
                }
                historyList.innerHTML = html;
            }

            // ── УПРАВЛЕНИЕ СЕКТОРАМИ ──
            function addSector() {
                const val = sectorInput.value.trim();
                if (!val) return;
                if (sectors.length >= 24) {
                    alert('Максимум 24 сектора');
                    return;
                }
                sectors.push(val);
                sectorInput.value = '';
                sectorInput.focus();
                updateUI();
            }

            function removeSector(index) {
                if (isSpinning) return;
                if (sectors.length <= 2) {
                    alert('Нужно минимум 2 сектора');
                    return;
                }
                sectors.splice(index, 1);
                if (highlightIndex >= sectors.length) highlightIndex = -1;
                updateUI(highlightIndex);
            }

            // ── ВРАЩЕНИЕ (ОПТИМИЗИРОВАННОЕ) ──
            function spinWheel() {
                if (isSpinning) return;
                if (sectors.length < 2) {
                    alert('Добавьте хотя бы 2 сектора!');
                    return;
                }

                isSpinning = true;
                spinBtn.disabled = true;
                resultOverlay.classList.remove('show');

                const spins = 5 + Math.random() * 5;
                const extraAngle = Math.random() * Math.PI * 2;
                const targetAngle = currentAngle + spins * Math.PI * 2 + extraAngle;

                const duration = 2800 + Math.random() * 800;
                const startTime = performance.now();
                const startAngle = currentAngle;

                function animateSpin(time) {
                    const progress = Math.min((time - startTime) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 4);
                    currentAngle = startAngle + (targetAngle - startAngle) * ease;
                    drawWheel();

                    if (progress < 1) {
                        animationId = requestAnimationFrame(animateSpin);
                    } else {
                        currentAngle = targetAngle;
                        finishSpin();
                    }
                }

                function finishSpin() {
                    const count = sectors.length;
                    const arc = (Math.PI * 2) / count;
                    let normAngle = currentAngle % (Math.PI * 2);
                    if (normAngle < 0) normAngle += Math.PI * 2;
                    const pointerAngle = -Math.PI / 2;
                    let relative = (pointerAngle - normAngle) % (Math.PI * 2);
                    if (relative < 0) relative += Math.PI * 2;
                    const idx = Math.floor(relative / arc) % count;

                    const winner = sectors[idx] || '?';
                    resultOverlay.textContent = winner;
                    resultOverlay.classList.add('show');

                    updateUI(idx);

                    history.push({ label: winner, highlight: true });
                    if (history.length > 50) history = history.slice(-50);
                    renderHistory();

                    isSpinning = false;
                    spinBtn.disabled = false;

                    setTimeout(() => {
                        if (!isSpinning) {
                            updateUI(-1);
                        }
                    }, 2000);
                }

                animationId = requestAnimationFrame(animateSpin);
            }

            // ── ОЧИСТКА ──
            function clearHistory() {
                history = [];
                renderHistory();
            }

            // ── РЕСАЙЗ (С DEBOUNCE) ──
            function resizeCanvas() {
                const rect = container.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height);
                const displaySize = Math.min(size, 400);

                // Сохраняем высокое качество при маленьком размере
                const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                const canvasSize = Math.round(displaySize * pixelRatio);

                canvas.style.width = displaySize + 'px';
                canvas.style.height = displaySize + 'px';
                canvas.width = Math.min(canvasSize, 600);
                canvas.height = Math.min(canvasSize, 600);

                drawWheel(highlightIndex);
            }

            // ── СОБЫТИЯ ──
            addBtn.addEventListener('click', addSector);
            sectorInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addSector(); });
            spinBtn.addEventListener('click', spinWheel);
            container.addEventListener('click', spinWheel);
            clearHistoryBtn.addEventListener('click', clearHistory);

            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(resizeCanvas, 150);
            });

            // ── ИНИЦИАЛИЗАЦИЯ ──
            resizeCanvas();
            renderSectorTags();
            renderHistory();

            sectorInput.placeholder = 'Название сектора';
            console.log('🌀 Оптимизированное колесо Да/Нет готово!');
        })();
    </script>

</body>
</html>
